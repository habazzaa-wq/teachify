# Teachify SaaS - Nginx Production Configuration
# Place in /etc/nginx/sites-available/teachify
# Symlink to /etc/nginx/sites-enabled/teachify

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream definitions
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream laravel {
    server unix:/var/www/teachify/apps/api/storage/logs/nginx.sock fail_timeout=0;
    # Alternative: server 127.0.0.1:9000;
}

# ──────────────────────────────────────────────
# HTTP → HTTPS redirect
# ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name teachify.tech *.teachify.tech;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/teachify/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────
# Main HTTPS server
# ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teachify.tech *.teachify.tech;

    root /var/www/teachify/apps/web/public;
    index index.html;

    # ── SSL ──
    ssl_certificate /etc/letsencrypt/live/teachify.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teachify.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/teachify.tech/chain.pem;

    # ── SSL hardening ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Upload size (Bunny media uploads) ──
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Logging ──
    access_log /var/www/teachify/logs/nginx-access.log;
    error_log /var/www/teachify/logs/nginx-error.log warn;

    # ── Favicon / static assets (Next.js) ──
    location /favicon.ico {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1d;
    }

    # ── Next.js _next static files ──
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Public static assets ──
    location /public/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 30d;
    }

    # ── Laravel API routes ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Timeout for large uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Sanctum CSRF routes ──
    location /sanctum/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Login rate limiting ──
    location ~ ^/api/v1/(auth|tenant/auth)/login$ {
        limit_req zone=login burst=3 nodelay;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Bunny webhook (no rate limit) ──
    location = /api/v1/integrations/bunny/webhooks {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media proxy (large streaming responses) ──
    location /api/v1/media/serve/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ── Diagnostics ──
    location = /api/diag/ping {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
    }

    # ── Everything else → Next.js ──
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Block hidden files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
