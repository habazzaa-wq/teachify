[program:teachify-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/teachify/apps/api/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/teachify/logs/queue-default.log
stopwaitsecs=3600
stoprestart_delay=5

[program:teachify-queue-imports]
; Long-running question-import extraction (OCR/Vision, job timeout 300s).
; Isolated from "default" so a slow import never blocks user-facing jobs.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/teachify/apps/api/artisan queue:work database --queue=imports --sleep=1 --tries=2 --timeout=300 --max-time=3600 --max-jobs=200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/teachify/logs/queue-imports.log
stopwaitsecs=3600
stoprestart_delay=5

[program:teachify-queue-bunny]
; Bunny CDN upload/delete/sync/thumbnail jobs.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/teachify/apps/api/artisan queue:work database --queue=bunny,bunny-high --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/teachify/logs/queue-bunny.log
stopwaitsecs=600
stoprestart_delay=5

[program:teachify-queue-usage]
; Tenant usage aggregation/sync jobs.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/teachify/apps/api/artisan queue:work database --queue=usage --sleep=10 --tries=3 --timeout=300 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/teachify/logs/queue-usage.log
stopwaitsecs=600
stoprestart_delay=5

[program:teachify-scheduler]
process_name=%(program_name)s
command=php /var/www/teachify/apps/api/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/teachify/logs/scheduler.log
stopwaitsecs=10
